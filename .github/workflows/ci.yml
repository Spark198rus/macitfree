name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty for a normal CI run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    name: macOS app + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          bsdtar --version

      - name: Install optional helper tools
        run: brew install sevenzip zstd brotli xz lz4 || true

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle and DMG
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then export VERSION="${RELEASE_TAG#v}"; fi
          scripts/build-app.sh --dmg

      - name: Smoke-test the bundled CLI
        run: |
          CLI=build/MacItFree.app/Contents/Resources/bin/mif
          lipo -info "$CLI"
          $CLI formats
          $CLI create /tmp/smoke.zip Sources
          $CLI test /tmp/smoke.zip
          $CLI list /tmp/smoke.zip | head

      - name: Launch the app and take screenshots
        run: |
          mkdir -p build/screenshots
          open build/MacItFree.app
          sleep 8
          pgrep -x MacItFree
          screencapture -x build/screenshots/1-main-window.png || true
          build/MacItFree.app/Contents/Resources/bin/mif create /tmp/Demo.zip Sources Tests README.md
          open -a "$PWD/build/MacItFree.app" /tmp/Demo.zip
          sleep 6
          screencapture -x build/screenshots/2-archive-browser.png || true
          pgrep -x MacItFree
          osascript -e 'tell application "MacItFree" to quit' || pkill -x MacItFree || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots

      - name: Zip app
        run: ditto -c -k --keepParent build/MacItFree.app build/MacItFree.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacItFree
          path: |
            build/MacItFree.dmg
            build/MacItFree.zip

      - name: Checksums
        run: |
          cd build
          shasum -a 256 MacItFree.dmg MacItFree.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MacItFree ${{ inputs.release_tag || github.ref_name }}
          body_path: Packaging/RELEASE_NOTES.md
          files: |
            build/MacItFree.dmg
            build/MacItFree.zip
            build/SHA256SUMS.txt

  linux:
    name: Core library + CLI (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install archivers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libarchive-tools zip unzip 7zip xz-utils zstd brotli lz4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
